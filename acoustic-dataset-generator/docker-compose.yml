version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/datasets:/app/datasets
      - ./backend/uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - simnet

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - simnet

networks:
  simnet:
    driver: bridge
