run:
  tag: "example"
  out_dir: "runs"
  seed: 0

dataset:
  name: "dummy"  # kendi datasetin için yeni loader ekle
  dummy:
    n_examples: 20
    fs: 16000
    duration_s: 0.5
    doa_deg: 30.0

array:
  mic_positions_m:  # (M,3)
    - [0.00, 0.00, 0.00]
    - [0.05, 0.00, 0.00]
    - [0.10, 0.00, 0.00]
    - [0.15, 0.00, 0.00]
  sound_speed: 343.0

algorithms:
  - name: "gcc_phat"
  - name: "delay_and_sum"
  - name: "srp_phat"

metrics:
  angle:
    enabled: true

search:
  doa_grid_deg:
    start: -90
    stop: 90
    step: 1
